<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Sites</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      background: linear-gradient(135deg, #1e293b, #0f172a);
      color: #f8fafc;
    }
    h1 { font-size: 2rem; margin-bottom: 0.5rem; }
    .buttons {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      width: min(320px, 90vw);
    }
    .buttons a {
      display: block;
      padding: 1rem;
      text-align: center;
      font-size: 1.1rem;
      font-weight: 600;
      color: #1e293b;
      background: #f8fafc;
      border-radius: 10px;
      text-decoration: none;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .buttons a:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.4);
    }
  </style>
</head>
<body>
  <h1>My Sites</h1>
  <div class="buttons">
    <a href="https://snowy5233.github.io/WebXR/">Web-XR</a>
    <a href="https://snowy5233.github.io/Tech-Projector/">Tech-Projector</a>
    <a href="https://snowy5233.github.io/Click-Counter/">Click-Counter</a>
    <a href="https://snowy5233.github.io/Overhoor/">Overhoor</a>
  </div>
</body>
</html>
